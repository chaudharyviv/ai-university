[project]
name = "ai-university"
version = "0.1.0"
description = "Multi-agent system that generates full educational courses (curriculum, notebooks, slides, quizzes, assignments) using specialized LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]
keywords = ["ai-agents", "education", "llm", "multi-agent", "streamlit"]

dependencies = [
    "streamlit>=1.38",
    "smolagents>=1.3",
    "litellm>=1.48",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "loguru>=0.7",
    "python-pptx>=1.0",
    "nbformat>=5.10",
    "tavily-python>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
